<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF2F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1311" media="(prefers-color-scheme: dark)">
<title>Kalibra</title>
<meta name="description" content="Adaptive nutrition and training coach that learns your real energy expenditure.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kalibra">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('kal-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
:root{
  --bg:#EEF2F0;--surface:#FFFFFF;--surface-2:#F3F6F5;--ink:#0F2420;--mute:#5F706B;--line:#DFE6E3;
  --brand:#0B7A5F;--brand-2:#15A37F;--brand-ink:#FFFFFF;--brand-soft:#DCEFE8;
  --hero:#0F2A24;--hero-ink:#EAF5F1;--hero-mute:#9FC0B6;--hero-track:rgba(255,255,255,.12);
  --pro:#E2483D;--carb:#2F7FE8;--fat:#E9A21B;--over:#C2410C;--gold:#E9A21B;
  --track:#E5EBE8;--shadow:0 1px 0 rgba(15,36,32,.03),0 10px 30px -18px rgba(15,36,32,.35);
  --r-xl:28px;--r-lg:22px;--r-md:16px;--r-sm:12px;
  --spring:cubic-bezier(.32,.72,0,1);--out:cubic-bezier(.2,.8,.2,1);
  --font:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1311;--surface:#121D1A;--surface-2:#182622;--ink:#E7F0EC;--mute:#8EA19A;--line:#22312D;
  --brand:#2BC79B;--brand-2:#5BE0B8;--brand-ink:#04231A;--brand-soft:#143A30;
  --hero:#0F2E26;--hero-ink:#EAF5F1;--hero-mute:#8FB8AB;
  --pro:#F2675D;--carb:#5B9BF2;--fat:#F2B544;--over:#F07C45;--track:#1F2D29;--shadow:0 10px 30px -16px rgba(0,0,0,.9);
}}
:root[data-theme="dark"]{
  --bg:#0A1311;--surface:#121D1A;--surface-2:#182622;--ink:#E7F0EC;--mute:#8EA19A;--line:#22312D;
  --brand:#2BC79B;--brand-2:#5BE0B8;--brand-ink:#04231A;--brand-soft:#143A30;
  --hero:#0F2E26;--hero-ink:#EAF5F1;--hero-mute:#8FB8AB;
  --pro:#F2675D;--carb:#5B9BF2;--fat:#F2B544;--over:#F07C45;--track:#1F2D29;--shadow:0 10px 30px -16px rgba(0,0,0,.9);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-font-smoothing:antialiased}
body{overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0;touch-action:manipulation}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums;font-stretch:80%}
.mute{color:var(--mute)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom));view-transition-name:main}
.hide{display:none!important}

/* ---------- motion ---------- */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes vt-in-f{from{opacity:0;transform:translateX(28px)}}
@keyframes vt-in-b{from{opacity:0;transform:translateX(-28px)}}
@keyframes vt-out-f{to{opacity:0;transform:translateX(-18px)}}
@keyframes vt-out-b{to{opacity:0;transform:translateX(18px)}}
::view-transition-old(main){animation:vt-out-f .2s ease-in both}
::view-transition-new(main){animation:vt-in-f .42s var(--spring) both}
html[data-dir="back"]::view-transition-old(main){animation-name:vt-out-b}
html[data-dir="back"]::view-transition-new(main){animation-name:vt-in-b}
::view-transition-old(root),::view-transition-new(root){animation-duration:.25s}
.wrap.enter{animation:rise .4s var(--spring) both}
.wrap.stagger>*{animation:rise .5s var(--spring) both}
.wrap.stagger>*:nth-child(2){animation-delay:.04s}.wrap.stagger>*:nth-child(3){animation-delay:.08s}.wrap.stagger>*:nth-child(4){animation-delay:.12s}.wrap.stagger>*:nth-child(5){animation-delay:.16s}.wrap.stagger>*:nth-child(n+6){animation-delay:.2s}
.press,.btn,.stat,.entry,.tcard,.tpl-b,.result,.choice,.chip,.tab,.banner{transition:transform .18s var(--out),background-color .2s,box-shadow .2s}
.btn:active,.stat:active,.tcard:active,.tpl-b:active,.banner:active,.choice:active,.chip:active{transform:scale(.97)}
.entry:active,.result:active{transform:scale(.99)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);padding:calc(env(safe-area-inset-top) + 10px) 0 10px;view-transition-name:top}
.top-in{max-width:560px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:8px}
.top h1{font-size:28px;font-stretch:72%;font-weight:800;flex:1;letter-spacing:-.015em}
.datenav{display:flex;align-items:center;gap:2px;background:var(--surface);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.datenav button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.datenav button:active{background:var(--surface-2)}
.datenav span{font-weight:600;font-size:14px;min-width:64px;text-align:center}
.icon-btn{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow)}
.lang-btn{height:40px;flex:none;display:flex;align-items:center;gap:5px;padding:0 12px 0 10px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-weight:800;font-size:13px;letter-spacing:.02em}
.lang-btn svg{width:17px;height:17px;color:var(--brand)}
.lang-btn:active{transform:scale(.95)}
.icon-btn.sm{width:34px;height:34px;box-shadow:none;background:var(--surface-2)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- cards ---------- */
.card{background:var(--surface);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);margin-top:14px}
.card h2{font-size:17px;display:flex;align-items:center;gap:8px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.link{color:var(--brand);font-weight:600;font-size:14px;text-decoration:none;cursor:pointer}
hr.sep{border:none;border-top:1px solid var(--line);margin:10px 0}

/* ---------- hero (the one bold surface) ---------- */
.hero{position:relative;overflow:hidden;display:block;width:100%;text-align:left;margin-top:14px;padding:22px 20px 20px;border-radius:var(--r-xl);color:var(--hero-ink);
  background:radial-gradient(120% 90% at 105% -10%,color-mix(in srgb,var(--brand-2) 55%,transparent) 0,transparent 55%),radial-gradient(80% 70% at -10% 120%,color-mix(in srgb,var(--carb) 22%,transparent) 0,transparent 60%),var(--hero);
  box-shadow:0 24px 50px -28px color-mix(in srgb,var(--hero) 90%,transparent)}
.hero .mute,.hero .big-l,.hero .sub,.hero .macro small{color:var(--hero-mute)}
.hero .card-h h2{color:var(--hero-ink)}
.hero .link{color:var(--brand-2)}
.hero-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.big{font-size:clamp(68px,23vw,104px);line-height:.8;font-weight:800;font-stretch:62%;letter-spacing:-.025em}
.big.over{color:#FF9B6A}
.big-l{font-size:14px;font-weight:600;margin-top:10px;display:block}
.hero-side{text-align:right;font-size:14px;line-height:1.7;color:var(--hero-mute)}
.hero-side b{font-weight:700;font-stretch:80%;font-size:18px;color:var(--hero-ink)}
.tag{white-space:nowrap;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--hero-track);color:var(--hero-ink);margin-bottom:6px}
.tag.on{background:color-mix(in srgb,var(--brand-2) 30%,transparent)}
.tag svg{width:14px;height:14px}
.gauge{display:flex;height:12px;border-radius:999px;background:var(--hero-track);overflow:hidden;margin-top:18px;gap:2px}
.gauge i{display:block;height:100%;border-radius:999px;transition:width .9s var(--spring)}
.gauge .g-p{background:var(--pro)}.gauge .g-c{background:var(--carb)}.gauge .g-f{background:var(--fat)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
.macro .lbl{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.macro .val{font-size:26px;font-weight:800;font-stretch:68%;line-height:1.1;margin-top:4px}
.macro .val small{font-size:13px;font-weight:500;color:var(--mute);font-stretch:100%}
.bar{height:6px;border-radius:999px;background:var(--track);overflow:hidden;margin-top:7px}
.hero .bar{background:var(--hero-track)}
.bar i{display:block;height:100%;border-radius:inherit;transition:width .9s var(--spring)}
.macro .sub{font-size:12px;color:var(--mute);margin-top:5px}

/* ---------- stat tiles ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:var(--surface);border-radius:var(--r-md);padding:12px 14px;box-shadow:var(--shadow);text-align:left;width:100%}
.stat .k{font-size:12px;color:var(--mute)}
.stat .v{font-size:24px;font-weight:800;font-stretch:68%;line-height:1.2}
.stat .v small{font-size:12px;font-weight:500;color:var(--mute);font-stretch:100%}

/* ---------- lists ---------- */
.entry{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.entry:first-of-type{border-top:none}
.entry .t{font-size:12px;color:var(--mute);width:42px;flex:none;font-variant-numeric:tabular-nums}
.entry .n{flex:1;min-width:0}
.entry .n b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .n span{font-size:13px;color:var(--mute)}
.entry .k{font-weight:700;font-stretch:80%;font-size:17px;text-align:right}
.pm{display:flex;gap:8px;font-size:12px;margin-top:2px}
.pm em{font-style:normal;font-weight:600}
.empty{text-align:center;padding:22px 8px;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.wrap>.row-btns{margin-top:14px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;border-radius:999px;font-weight:700;background:var(--brand);color:var(--brand-ink);box-shadow:0 8px 20px -12px color-mix(in srgb,var(--brand) 80%,transparent)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.card .btn.ghost,.sheet .btn.ghost{background:var(--surface-2);box-shadow:none}
.btn.light{background:var(--hero-ink);color:var(--hero);box-shadow:none;margin-top:16px}
.btn.sm{height:40px;padding:0 16px;font-size:14px}
.btn.block{width:100%}
.btn.danger{background:transparent;color:var(--over);border:1.5px solid color-mix(in srgb,var(--over) 50%,transparent);box-shadow:none}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- floating tab bar ---------- */
.tabbar{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;max-width:520px;margin:0 auto;border-radius:26px;
  background:color-mix(in srgb,var(--surface) 80%,transparent);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);
  border:1px solid color-mix(in srgb,var(--line) 70%,transparent);box-shadow:0 20px 40px -20px rgba(0,0,0,.35);view-transition-name:nav}
.tabbar-in{position:relative;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:64px;padding:0 4px}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mute);height:100%;justify-content:center;transition:color .25s}
.tab[aria-current="page"]{color:var(--brand)}
.tab[aria-current="page"] svg{transform:translateY(-1px)}
.tab svg{transition:transform .3s var(--spring)}
.tab-ind{position:absolute;top:8px;bottom:8px;left:4px;width:calc((100% - 8px) / 5);border-radius:18px;background:var(--brand-soft);transform:translateX(calc(var(--i,0) * 100%));transition:transform .5s var(--spring),opacity .2s}
.fab{position:relative;z-index:2;width:56px;height:56px;border-radius:20px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;margin:0 auto;transform:translateY(-16px);
  box-shadow:0 14px 28px -10px color-mix(in srgb,var(--brand) 80%,transparent);transition:transform .35s var(--spring),border-radius .35s var(--spring)}
.fab svg{width:28px;height:28px;stroke-width:2.4;transition:transform .35s var(--spring)}
.fab:active{transform:translateY(-16px) scale(.92)}
.fab[aria-expanded="true"]{border-radius:50%}
.fab[aria-expanded="true"] svg{transform:rotate(135deg)}
.dial{position:fixed;inset:0;z-index:29}
.dial-scrim{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .25s}
.dial.on .dial-scrim{opacity:1}
.dial-list{position:absolute;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px}
.dial-btn{display:flex;align-items:center;gap:10px;height:52px;padding:0 22px 0 18px;border-radius:999px;background:var(--surface);box-shadow:0 16px 30px -16px rgba(0,0,0,.45);font-weight:700;white-space:nowrap;
  opacity:0;transform:translateY(24px) scale(.9);transition:opacity .25s,transform .45s var(--spring);transition-delay:calc(var(--d) * 45ms)}
.dial-btn svg{color:var(--brand)}
.dial.on .dial-btn{opacity:1;transform:none}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;background:rgba(3,12,10,.5);z-index:50;opacity:0;transition:opacity .35s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:93vh;max-height:93dvh;display:flex;flex-direction:column;background:var(--bg);border-radius:28px 28px 0 0;transform:translateY(105%);transition:transform .5s var(--spring);max-width:560px;margin:0 auto;box-shadow:0 -10px 40px -20px rgba(0,0,0,.4);will-change:transform}
.sheet.on{transform:none}
.sheet.dragging{transition:none}
.sheet.full{height:93vh;height:93dvh}
.sheet-h{display:flex;align-items:center;gap:10px;padding:10px 16px 8px;touch-action:none;cursor:grab}
.sheet-h h2{flex:1;font-size:22px;font-stretch:80%;font-weight:800}
.sheet-b{overflow:auto;padding:4px 16px calc(28px + env(safe-area-inset-bottom));flex:1;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:10px auto 0;touch-action:none;cursor:grab}

/* ---------- forms ---------- */
.field{display:block;margin-top:14px}
.field>span{display:block;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:6px}
.input,select.input{width:100%;height:52px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:17px;outline:none;appearance:none;-webkit-appearance:none;transition:border-color .2s,box-shadow .2s}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 18%,transparent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:4px}
.card .seg{background:var(--surface-2)}
.wrap>.seg{background:var(--surface);box-shadow:var(--shadow)}
.seg button{flex:1;height:38px;border-radius:999px;font-weight:600;font-size:14px;color:var(--mute);transition:background .25s,color .25s,box-shadow .25s}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);box-shadow:0 6px 14px -8px color-mix(in srgb,var(--brand) 90%,transparent)}
.choice{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:var(--r-md);background:var(--surface);border:1.5px solid var(--line);margin-top:8px}
.choice b{display:block}
.choice span{font-size:13px;color:var(--mute)}
.choice[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.days{display:flex;gap:6px}
.days button{flex:1;aspect-ratio:1;max-width:46px;border-radius:50%;background:var(--surface-2);font-weight:700;color:var(--mute);transition:background .25s,color .25s,transform .3s var(--spring)}
.days button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);transform:scale(1.05)}
.split{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.split div{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px}
.split span{display:block;font-size:12px;color:var(--mute)}
.split b{font-size:20px;font-weight:800;font-stretch:70%}
.search{position:relative}
.search svg{position:absolute;left:15px;top:16px;color:var(--mute)}
.search .input{padding-left:44px}
.chips{display:flex;gap:8px;overflow:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip svg{width:16px;height:16px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.result{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 2px;border-bottom:1px solid var(--line)}
.result .n{flex:1;min-width:0}
.result .n b{display:block;font-weight:600;line-height:1.3}
.result .n span{font-size:13px;color:var(--mute)}
.result .k{font-weight:700;font-stretch:80%;text-align:right;white-space:nowrap}
.result .k small{display:block;font-weight:500;font-size:11px;color:var(--mute);font-stretch:100%}
.add-dot{width:32px;height:32px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.note{font-size:13px;color:var(--mute);line-height:1.55;margin:10px 0 0}
.banner{display:flex;gap:12px;align-items:center;background:var(--brand);color:var(--brand-ink);border-radius:var(--r-lg);padding:14px 16px;margin-top:14px;width:100%;text-align:left;box-shadow:0 14px 30px -18px color-mix(in srgb,var(--brand) 90%,transparent)}
.banner>div{flex:1}
.banner b{display:block}
.banner span{font-size:13px;opacity:.85}
.banner.soft{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.banner.soft>svg:first-child{color:var(--brand)}
.banner.soft span{color:var(--mute);opacity:1}
.nutri{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.nutri div{background:var(--surface);border-radius:var(--r-md);padding:10px 6px;text-align:center}
.nutri b{display:block;font-size:22px;font-weight:800;font-stretch:70%}
.nutri div>span{font-size:12px;color:var(--mute)}

/* ---------- charts & key/values ---------- */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-size:10px;fill:var(--mute);font-family:var(--font)}
.chart path{stroke-dasharray:var(--len,none)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:8px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.kv{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:15px;gap:12px;width:100%;text-align:left}
.kv:first-of-type{border-top:none}
.kv b{font-weight:700;font-stretch:85%;text-align:right}
.kv .up{color:var(--brand);font-size:13px}.kv .down{color:var(--over);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px) scale(.96);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:opacity .25s,transform .45s var(--spring);z-index:90;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ---------- training ---------- */
.tcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--shadow);margin-top:12px}
.tcard .n{flex:1;min-width:0}.tcard .n b{display:block}.tcard .n span{font-size:13px;color:var(--mute)}
.tcard .ic{width:40px;height:40px;border-radius:14px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.tcard>svg:last-child{color:var(--brand)}
.tcard .tick{width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.tcard .tick svg{width:16px;height:16px;stroke-width:3}
.tcard.live{background:var(--hero);color:var(--hero-ink)}
.tcard.live .n span{color:var(--hero-mute)}
.pulse{width:12px;height:12px;border-radius:50%;background:var(--brand-2);flex:none;box-shadow:0 0 0 0 color-mix(in srgb,var(--brand-2) 60%,transparent);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}
.hero.resume{display:flex;align-items:center;gap:16px}
.hero.resume>div:nth-child(2){flex:1}
.hero.resume>svg{width:28px;height:28px}
.resume-n{display:block;font-size:34px;font-weight:800;font-stretch:66%;line-height:1.05;margin:4px 0 2px}
.next-l{color:var(--hero-mute);font-size:14px;margin:6px 0 0}
.tpl{display:flex;align-items:center;gap:10px;padding:6px 0}
.tpl-b{flex:1;text-align:left;padding:10px 12px;border-radius:var(--r-md);background:var(--surface-2);min-width:0}
.tpl-b b{display:block}
.tpl-b span{display:block;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv{display:grid;gap:7px}
.mv-r{display:grid;grid-template-columns:96px 1fr 34px;align-items:center;gap:10px;font-size:13px}
.mv-r b{text-align:right;font-size:14px}
.mv-b{position:relative;height:10px;border-radius:999px;background:var(--track);overflow:hidden}
.mv-b i:not(.mv-zone){position:relative;display:block;height:100%;border-radius:999px;transition:width 1s var(--spring)}
.mv-zone{position:absolute;left:41.6%;width:41.7%;top:0;bottom:0;background:color-mix(in srgb,var(--brand) 14%,transparent)}
.pr-tag{display:inline-block;font-size:11px;font-weight:800;padding:1px 6px;border-radius:6px;background:var(--gold);color:#2a1d00;vertical-align:1px}
.lift{cursor:pointer}

/* live workout */
.sheet.workout{background:var(--bg)}
.wo-bar{position:sticky;top:-4px;z-index:3;display:flex;align-items:center;gap:16px;padding:10px 14px;margin:0 -4px 6px;border-radius:var(--r-lg);background:var(--hero);color:var(--hero-ink)}
.wo-bar>div{display:flex;flex-direction:column;line-height:1.15}
.wo-bar span{font-size:11px}.wo-bar .mute{color:var(--hero-mute)}
.wo-bar b{font-size:22px;font-weight:800}
.wo-bar .btn{margin-left:auto;background:var(--brand-2);color:var(--brand-ink)}
.xcard{background:var(--surface);border-radius:var(--r-lg);padding:14px 12px 8px;margin-top:12px;box-shadow:var(--shadow);animation:rise .4s var(--spring) both}
.xh{display:flex;align-items:center;gap:8px;padding:0 4px}
.xn{flex:1;text-align:left;min-width:0}
.xn b{display:block;font-size:17px;color:var(--brand)}
.xn span{font-size:12px;color:var(--mute)}
.xhint{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--mute);background:var(--surface-2);border-radius:var(--r-sm);padding:8px 10px;margin:10px 4px 4px}
.xhint svg{width:15px;height:15px;color:var(--fat)}
.xhint b{color:var(--ink)}
.shead,.srow{display:grid;grid-template-columns:34px 1fr 64px 52px 54px 40px;gap:6px;align-items:center;padding:0 4px}
.shead.one,.srow.one{grid-template-columns:34px 1fr 1fr 40px 40px}
.shead{font-size:11px;font-weight:700;color:var(--mute);margin:10px 0 4px}
.shead span{text-align:center}.shead span:nth-child(2){text-align:left}
.srow{height:48px;border-radius:var(--r-sm);transition:background .3s}
.srow.done{background:color-mix(in srgb,var(--brand) 13%,transparent)}
.srow.warm .sn{color:var(--fat)}
.srow.pr{background:color-mix(in srgb,var(--gold) 20%,transparent)}
.sn{width:30px;height:30px;border-radius:9px;background:var(--surface-2);font-weight:800;font-size:13px}
.sp{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si{width:100%;height:38px;border-radius:10px;border:none;background:var(--surface-2);text-align:center;font-size:16px;font-weight:700;font-stretch:85%;outline:none;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
.si:focus{box-shadow:0 0 0 2px var(--brand)}
.si::placeholder{color:color-mix(in srgb,var(--mute) 70%,transparent);font-weight:600}
.srow.done .si{background:transparent}
select.si.rir{font-size:13px;padding:0}
.si-u{font-size:12px;color:var(--mute)}
.sc{width:36px;height:36px;border-radius:11px;background:var(--surface-2);color:var(--mute);display:grid;place-items:center;transition:background .25s,color .25s,transform .4s var(--spring)}
.sc svg{width:18px;height:18px;stroke-width:3}
.srow.done .sc{background:var(--brand);color:var(--brand-ink)}
.srow.pop .sc{animation:pop .45s var(--spring)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.addset{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:40px;margin-top:4px;border-radius:var(--r-sm);font-weight:700;font-size:14px;color:var(--mute)}
.addset svg{width:16px;height:16px}
.trow{display:grid;grid-template-columns:1fr 54px 54px 54px 34px;gap:6px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.trow .n b{display:block;font-size:15px}.trow .n span{font-size:12px}
.trow label{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--mute);gap:2px}
.resting .sheet-b{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.rest{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));z-index:70;display:flex;align-items:center;gap:6px;padding:8px 8px 8px 10px;border-radius:999px;background:var(--hero);color:var(--hero-ink);box-shadow:0 20px 40px -16px rgba(0,0,0,.55);
  transform:translate(-50%,140%);transition:transform .5s var(--spring)}
.rest.on{transform:translate(-50%,0)}
.rest .ring{width:40px;height:40px;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--hero-track);stroke-width:4}
.ring-fg{fill:none;stroke:var(--brand-2);stroke-width:4;stroke-linecap:round;stroke-dasharray:100;transition:stroke-dashoffset .25s linear}
.rest-t{display:flex;flex-direction:column;line-height:1.1;min-width:58px}
.rest-t span{font-size:11px;color:var(--hero-mute)}
.rest-t b{font-size:20px;font-weight:800}
.rest button{height:38px;padding:0 12px;border-radius:999px;background:var(--hero-track);font-weight:700;font-size:13px}
.done-hero{text-align:center;padding:8px 0 16px}
.done-hero h3{font-size:26px;font-stretch:72%;font-weight:800;margin-top:12px}
.done-hero p{margin:4px 0 0}
.burst{width:84px;height:84px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,var(--gold),color-mix(in srgb,var(--gold) 60%,transparent));color:#2a1d00;animation:burst .8s var(--spring) both;box-shadow:0 0 0 12px color-mix(in srgb,var(--gold) 18%,transparent)}
.burst svg{width:40px;height:40px;stroke-width:2.2}
@keyframes burst{0%{transform:scale(.2) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
.fuel h2 svg{color:var(--pro)}

/* ---------- explanations, guides, coaching ---------- */
.explain{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border-radius:var(--r-md);padding:12px 14px;margin-top:12px;box-shadow:var(--shadow)}
.explain svg{color:var(--fat);margin-top:2px}
.explain p{margin:0;font-size:14px;line-height:1.5}
.explain.good svg{color:var(--gold)}
.explain.warn{background:color-mix(in srgb,var(--over) 10%,var(--surface))}
.explain.warn svg{color:var(--over)}
.why{padding:12px 0;border-top:1px solid var(--line)}
.why:first-of-type{border-top:none;padding-top:0}
.why-h{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.why-h span{font-weight:600}
.why-h b{font-size:18px;font-weight:800;font-stretch:75%;text-align:right}
.why p{margin:4px 0 0;font-size:13px;line-height:1.5;color:var(--mute)}
.guide p,.guide li{font-size:14px;line-height:1.6;color:color-mix(in srgb,var(--ink) 85%,var(--mute))}
.guide p{margin:10px 0 0}
.guide ol{margin:10px 0 0;padding-left:20px}
.guide li{margin-top:6px}
.gt{display:grid;grid-template-columns:1fr auto;gap:8px 12px;background:var(--surface-2);border-radius:var(--r-sm);padding:12px 14px;margin-top:12px;font-size:14px}
.gt b{font-weight:800;font-stretch:80%;text-align:right}
.lvl{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin-top:12px}
.lvl.me{border-color:var(--brand)}
.lvl.me b::after{content:" · you";color:var(--brand)}
.lvl p{margin:4px 0 0}
.pick{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand);vertical-align:2px}
.cues{margin:8px 4px 0;font-size:13px}
.cues summary{cursor:pointer;color:var(--mute);font-weight:600;display:flex;align-items:center;gap:8px;list-style:none}
.cues summary::-webkit-details-marker{display:none}
.cues summary::after{content:"+";margin-left:auto;font-size:16px;transition:transform .3s var(--spring)}
.cues[open] summary::after{transform:rotate(45deg)}
.cues p{margin:6px 0 2px;line-height:1.5}
.xhint.warn{background:color-mix(in srgb,var(--over) 10%,transparent)}
.xhint.warn svg{color:var(--over)}
.swap{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 2px;border-bottom:1px solid var(--line)}
.swap .n{flex:1;min-width:0}
.swap .n b{display:block;font-weight:600;line-height:1.35}
.crit{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:3px}
.crit em{font-style:normal}.crit i{font-style:normal;color:var(--brand);letter-spacing:1px}
.srow{position:relative}
.srow:not([data-gain=""])[data-gain]::after{content:attr(data-gain);position:absolute;left:40px;bottom:-3px;font-size:10px;font-weight:800;line-height:1;padding:2px 6px;border-radius:999px;background:var(--brand);color:var(--brand-ink);animation:pop .45s var(--spring)}

/* ---------- gym ---------- */
.sub-h{font-size:15px;font-weight:700;margin:18px 0 8px}
.gym{border-radius:var(--r-md);background:var(--surface);box-shadow:var(--shadow);margin-top:8px;border:1.5px solid transparent;transition:border-color .25s}
.gym.sel{border-color:var(--brand)}
.gym-b{display:block;width:100%;text-align:left;padding:12px 14px}
.gym-b b{display:block}.gym-b span{display:block;font-size:13px;color:var(--mute)}
.gym-f{margin-top:2px;color:var(--ink)!important}
.gym-b.other{border-radius:var(--r-md);background:var(--surface);box-shadow:var(--shadow);margin-top:8px;border:1.5px solid transparent}
.gym-b.other.sel{border-color:var(--brand)}
.gym-d{padding:0 14px 12px;font-size:13px;animation:rise .35s var(--spring)}
.gym-d p{margin:6px 0 0}
.eq{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.eq-b{display:flex;align-items:flex-start;gap:8px;text-align:left;padding:10px;border-radius:var(--r-sm);background:var(--surface);border:1.5px solid var(--line);font-size:13px;font-weight:600;transition:background .2s,border-color .2s}
.eq-b svg{width:16px;height:16px;flex:none;margin-top:1px;padding:2px;border-radius:5px;background:var(--surface-2);color:transparent;stroke-width:3;transition:background .2s,color .2s}
.eq-b[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.eq-b[aria-pressed="true"] svg{background:var(--brand);color:var(--brand-ink)}
.eq-b small{display:block;font-weight:500;color:var(--brand);font-size:11px}
.result.na{opacity:.55}
.na-t{color:var(--over)!important;font-size:12px}
button.link{font:inherit;font-weight:700;color:var(--brand)}

.upd{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translateX(-50%);z-index:95;display:flex;flex-direction:column;align-items:center;padding:10px 18px;border-radius:18px;background:var(--brand);color:var(--brand-ink);box-shadow:0 14px 30px -14px rgba(0,0,0,.5);animation:rise .5s var(--spring)}
.upd span{font-size:12px;opacity:.85}
/* ---------- onboarding ---------- */
.ob{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(20px + env(safe-area-inset-bottom))}
.ob-prog{display:flex;gap:4px}
.ob-prog i{flex:1;height:4px;border-radius:9px;background:var(--line);transition:background .4s}
.ob-prog i.on{background:var(--brand)}
.ob-body{flex:1;padding-top:28px;animation:rise .45s var(--spring) both}
.ob h1{font-size:36px;font-stretch:72%;font-weight:800;line-height:1.02}
.ob p.lead{color:var(--mute);margin:10px 0 8px}
.ob-foot{display:flex;gap:10px;padding-top:16px}
.ob-foot .btn{flex:1}
.wordmark{font-size:64px;font-weight:900;font-stretch:62%;letter-spacing:-.03em;line-height:.9;background:linear-gradient(120deg,var(--brand),var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.video{width:100%;border-radius:var(--r-lg);background:#000;aspect-ratio:4/3;object-fit:cover}
@media (max-width:360px){.shead,.srow{grid-template-columns:28px 1fr 58px 46px 48px 36px;gap:4px}.mv-r{grid-template-columns:80px 1fr 30px}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="foods.js"></script>
<script src="exercises.js"></script>
<script src="gyms.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
<script src="workouts.js"></script>
<script>
// Offline support + "new version" banner: the new service worker takes over in the background, and we offer a reload
// instead of reloading by ourselves (so nothing you are typing gets lost).
if ('serviceWorker' in navigator) addEventListener('load', () => {
  const had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(reg => {
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!had || document.getElementById('upd')) return;
    const b = document.createElement('button'); b.id = 'upd'; b.className = 'upd';
    b.innerHTML = '<b>Kalibra was updated</b><span>Tap to load the new version</span>';
    b.onclick = () => location.reload();
    document.body.append(b);
  });
});
</script>
</body>
