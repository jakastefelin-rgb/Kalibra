<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF1EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1513" media="(prefers-color-scheme: dark)">
<title>Kalibra</title>
<meta name="description" content="Adaptive calorie and macro coach that learns your real energy expenditure.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kalibra">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('kal-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
:root{
  --bg:#EDF1EF;--surface:#FFFFFF;--surface-2:#F5F8F7;--ink:#10241F;--mute:#5D6E69;--line:#DCE3E0;
  --brand:#0B7A5F;--brand-ink:#FFFFFF;--brand-soft:#DCEFE8;
  --pro:#E2483D;--carb:#2F7FE8;--fat:#E9A21B;--fib:#7A8F3A;--over:#C2410C;
  --track:#E3E9E6;--shadow:0 1px 0 rgba(16,36,31,.04),0 6px 20px -12px rgba(16,36,31,.25);
  --r-lg:22px;--r-md:14px;--r-sm:10px;
  --font:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1513;--surface:#14201D;--surface-2:#1A2824;--ink:#E8F0ED;--mute:#8FA19B;--line:#24332F;
  --brand:#2BC79B;--brand-ink:#05231B;--brand-soft:#173A31;--track:#22302C;
  --pro:#F2675D;--carb:#5B9BF2;--fat:#F2B544;--over:#F07C45;--shadow:0 6px 24px -14px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --bg:#0C1513;--surface:#14201D;--surface-2:#1A2824;--ink:#E8F0ED;--mute:#8FA19B;--line:#24332F;
  --brand:#2BC79B;--brand-ink:#05231B;--brand-soft:#173A31;--track:#22302C;
  --pro:#F2675D;--carb:#5B9BF2;--fat:#F2B544;--over:#F07C45;--shadow:0 6px 24px -14px rgba(0,0,0,.8);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums;font-stretch:80%}
.mute{color:var(--mute)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom))}

/* Header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(env(safe-area-inset-top) + 10px) 0 10px}
.top-in{max-width:560px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:8px}
.top h1{font-size:24px;font-stretch:90%;flex:1}
.datenav{display:flex;align-items:center;gap:2px;background:var(--surface);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.datenav button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.datenav button:hover{background:var(--surface-2)}
.datenav span{font-weight:600;font-size:14px;min-width:92px;text-align:center}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Cards */
.card{background:var(--surface);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);margin-top:14px}
.card h2{font-size:17px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.card-h a,.link{color:var(--brand);font-weight:600;font-size:14px;text-decoration:none;cursor:pointer}

/* Hero scoreboard */
.hero{padding:20px 18px 18px}
.hero-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.big{font-size:clamp(64px,22vw,96px);line-height:.82;font-weight:800;font-stretch:62%;letter-spacing:-.02em}
.big.over{color:var(--over)}
.big-l{font-size:15px;font-weight:600;margin-top:8px}
.hero-side{text-align:right;font-size:14px;line-height:1.6}
.hero-side b{font-weight:700;font-stretch:80%;font-size:17px}
.gauge{display:flex;height:14px;border-radius:999px;background:var(--track);overflow:hidden;margin-top:16px}
.gauge i{display:block;height:100%;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.gauge .g-p{background:var(--pro)}.gauge .g-c{background:var(--carb)}.gauge .g-f{background:var(--fat)}
.ticks{display:flex;justify-content:space-between;font-size:12px;margin-top:6px}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
.macro .lbl{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.macro .val{font-size:26px;font-weight:800;font-stretch:70%;line-height:1.1;margin-top:4px}
.macro .val small{font-size:13px;font-weight:500;color:var(--mute);font-stretch:100%}
.bar{height:6px;border-radius:999px;background:var(--track);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:inherit;transition:width .5s}
.macro .sub{font-size:12px;color:var(--mute);margin-top:4px}

/* Stat strip */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--surface);border-radius:var(--r-md);padding:12px 14px;box-shadow:var(--shadow);text-align:left;width:100%}
.stat .k{font-size:12px;color:var(--mute)}
.stat .v{font-size:22px;font-weight:800;font-stretch:72%;line-height:1.2}
.stat .v small{font-size:12px;font-weight:500;color:var(--mute);font-stretch:100%}

/* Food log */
.entry{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.entry:first-child{border-top:none}
.entry .t{font-size:12px;color:var(--mute);width:42px;flex:none;font-variant-numeric:tabular-nums}
.entry .n{flex:1;min-width:0}
.entry .n b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .n span{font-size:13px;color:var(--mute)}
.entry .k{font-weight:700;font-stretch:80%;font-size:17px;text-align:right}
.pm{display:flex;gap:8px;font-size:12px;color:var(--mute);margin-top:2px}
.pm em{font-style:normal}
.empty{text-align:center;padding:22px 8px;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:999px;font-weight:700;background:var(--brand);color:var(--brand-ink);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.sm{height:38px;padding:0 14px;font-size:14px}
.btn.block{width:100%}
.btn.danger{background:transparent;color:var(--over);border:1.5px solid currentColor}
.btn[disabled]{opacity:.45;pointer-events:none}

/* Tabbar + FAB */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;height:64px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mute);height:100%;justify-content:center}
.tab[aria-current="page"]{color:var(--brand)}
.fab{width:58px;height:58px;border-radius:20px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;margin:0 auto;transform:translateY(-14px);box-shadow:0 10px 24px -8px color-mix(in srgb,var(--brand) 70%,transparent)}
.fab svg{width:28px;height:28px;stroke-width:2.4}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgba(5,15,12,.45);z-index:50;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:var(--bg);border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto}
.sheet.on{transform:none}
.sheet.full{height:92vh;height:92dvh}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.sheet-h h2{flex:1;font-size:20px}
.sheet-b{overflow:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom));flex:1;-webkit-overflow-scrolling:touch}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Forms */
.field{display:block;margin-top:14px}
.field>span{display:block;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:6px}
.input,select.input{width:100%;height:50px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:17px;outline:none;appearance:none;-webkit-appearance:none}
.input:focus{border-color:var(--brand)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;height:38px;border-radius:999px;font-weight:600;font-size:14px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.choice{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:var(--r-md);background:var(--surface);border:1.5px solid var(--line);margin-top:8px}
.choice b{display:block}
.choice span{font-size:13px;color:var(--mute)}
.choice[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.search{position:relative}
.search svg{position:absolute;left:14px;top:15px;color:var(--mute)}
.search .input{padding-left:42px}
.chips{display:flex;gap:8px;overflow:auto;padding:12px 0 4px;scrollbar-width:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.result{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 2px;border-bottom:1px solid var(--line)}
.result .n{flex:1;min-width:0}
.result .n b{display:block;font-weight:600;line-height:1.3}
.result .n span{font-size:13px;color:var(--mute)}
.result .k{font-weight:700;font-stretch:80%;text-align:right;white-space:nowrap}
.result .k small{display:block;font-weight:500;font-size:11px;color:var(--mute);font-stretch:100%}
.add-dot{width:32px;height:32px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.note{font-size:13px;color:var(--mute);line-height:1.5;margin-top:10px}
.banner{display:flex;gap:12px;align-items:center;background:var(--brand);color:var(--brand-ink);border-radius:var(--r-lg);padding:14px 16px;margin-top:14px;width:100%;text-align:left}
.banner b{display:block}
.banner span{font-size:13px;opacity:.85}

/* Detail */
.nutri{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.nutri div{background:var(--surface);border-radius:var(--r-md);padding:10px;text-align:center}
.nutri b{display:block;font-size:22px;font-weight:800;font-stretch:72%}
.nutri span{font-size:12px;color:var(--mute)}

/* Charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-size:10px;fill:var(--mute);font-family:var(--font)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:8px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.kv{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);font-size:15px;gap:12px}
.kv:first-of-type{border-top:none}
.kv b{font-weight:700;font-stretch:85%;text-align:right}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:.25s;z-index:80;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}

/* Onboarding */
.ob{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(20px + env(safe-area-inset-bottom))}
.ob-prog{display:flex;gap:4px}
.ob-prog i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.ob-prog i.on{background:var(--brand)}
.ob-body{flex:1;padding-top:28px}
.ob h1{font-size:34px;font-stretch:75%;font-weight:800;line-height:1.05}
.ob p.lead{color:var(--mute);margin:10px 0 8px}
.ob-foot{display:flex;gap:10px;padding-top:16px}
.ob-foot .btn{flex:1}
.wordmark{font-size:56px;font-weight:900;font-stretch:62%;letter-spacing:-.02em;line-height:.9;color:var(--brand)}
.video{width:100%;border-radius:var(--r-lg);background:#000;aspect-ratio:4/3;object-fit:cover}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="foods.js"></script>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
</html>
